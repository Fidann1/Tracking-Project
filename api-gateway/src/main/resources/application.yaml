spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: order-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/orders/**
        - id: delivery-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/deliveries/**
        - id: product-service
          uri: http://localhost:8080
          predicates:
            - Path=/api/products/**

server:
  port: 8085
